[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lib*", "simulate*"]

[project.scripts]
auto_pilot = "lib.main:run_sync"

[project]
name = "soundswitch-auto-pilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-rtmidi>=1.5,<2",
    "cython",
    "madmom",
    "numpy>=1.26,<2",
    "pyaudio",
    "pandas",
    "scipy",
    "python-osc",
    "scikit-learn",
    "librosa",
    "argcomplete",
    "zeroconf",
    "netifaces",
    "setuptools<71",
    # The show. The section model is an ONNX graph, its encoder is a
    # transformers checkpoint, and torch is what loads and runs the encoder --
    # all three are on the live path now, not in an offline extra.
    # Versions are the set validated together on this box; see
    # .superpowers/sdd/2026-07-26-nn-classifier-v1-offline/cuda-preflight-report.md.
    # torch stays at 2.11: the legacy TorchScript ONNX exporter is the only path
    # that keeps a dynamic time axis for a GRU, and it is deprecated from 2.9.
    "torch>=2.11,<2.12",
    "transformers>=4.57,<5",
    "onnxruntime>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jupyterlab",
    # Retired, and alive here for exactly one task. Base no longer carries the
    # rule engine's front-end; lib/ still imports it until the demolition, so
    # the suite needs it installed and nothing else does. These three lines and
    # the two build shims below go together, in the commit that deletes their
    # importers.
    "aubio",
    "tensorflow>=2.16,<2.22",
    "tensorflow-hub>=0.16,<0.17",
]
visualizer = [
    "dash>=2.14",
    "sounddevice",
]
# Offline NN work only (training/nn/): never imported by lib/ or simulate/.
# torch and onnxruntime are base dependencies now and are deliberately not
# repeated here -- two pins for one package is two answers to which one ships.
# tensorboard is deliberately loose because TensorFlow pins it to its own version.
training = [
    "onnx>=1.22,<2",
    "tensorboard>=2.16",
    # tensorboard's image summaries encode through PIL and it is not a hard
    # dependency of tensorboard itself; without it the per-epoch confusion
    # matrix raises mid-epoch, an hour into a run.
    "pillow>=10",
]

# The CUDA wheel index, bound to torch alone.  `explicit = true` is load-bearing:
# without it uv consults this index for every package and shadows PyPI with an
# incomplete mirror.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
link-mode = "copy"
# Retired with the aubio entry in the dev extra above.
extra-build-variables = { aubio = { CFLAGS = "-Wno-incompatible-function-pointer-types" } }
# Resolve only for the environment this project actually runs in.  uv resolves
# universally across `requires-python`, and on the py3.13 branch ml-dtypes
# (pulled in by onnx) demands numpy>=2.1, which is unsatisfiable against the
# numpy<2 pin TensorFlow needs.  Removing this line breaks `uv lock`.
environments = ["sys_platform == 'win32' and python_full_version < '3.12'"]
# tensorflow-io-gcs-filesystem>=0.34 has no Windows wheels; pin to 0.31.0 on
# Windows. Retired with the tensorflow entries in the dev extra above.
override-dependencies = [
    "tensorflow-io-gcs-filesystem==0.31.0 ; sys_platform == 'win32'",
]
# madmom's last PyPI release (0.16.1, 2018) cannot be imported on Python >= 3.10
# — `from collections import MutableSequence`. Git main fixed that and carries a
# pyproject.toml, so it builds on py3.11/MSVC; there is no tagged release with
# the fix, hence a SHA. Build isolation is off because the Cython/numpy build
# needs this environment's numpy ABI, and the build deps are named explicitly
# rather than inherited from whatever happens to be installed.
no-build-isolation-package = ["madmom"]
extra-build-dependencies = { madmom = ["cython", "numpy>=1.26,<2", "setuptools<71"] }

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
madmom = { git = "https://github.com/CPJKU/madmom.git", rev = "27f032e8947204902c675e5e341a3faf5dc86dae" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: full-pipeline simulation tests (slow, requires aubio and madmom)",
]
